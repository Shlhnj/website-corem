<header class="site">
  <nav>
    <a class="brand" href="{{ '/' | relative_url }}">
      {{ site.title }}
      <span class="full">{{ site.subtitle }}</span>
    </a>
    <div class="nav-menu">
      <ul class="navlinks" id="navlinks">
        {% for item in site.data.nav %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} class="current"{% endif %}>
          <span class="lang-en">{{ item.title }}</span><span class="lang-id">{{ item.title_id }}</span>
        </a></li>
        {% endfor %}
      </ul>
      <div class="nav-right">
        <div class="lang-switch" role="group" aria-label="Language / Bahasa">
          <button type="button" class="lang-btn" data-lang-btn="en">EN</button>
          <button type="button" class="lang-btn" data-lang-btn="id">ID</button>
        </div>
        <button class="nav-toggle" aria-expanded="false" aria-controls="navlinks">Menu</button>
      </div>
    </div>
  </nav>
</header>
