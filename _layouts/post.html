---
layout: default
---
<section class="page-section">
  <div class="wrap wrap-narrow">
    <div class="post-meta mono">{{ page.date | date: "%d %B %Y" }}</div>
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-body">
      {{ content }}
    </div>
    <p class="back-link"><a href="{{ '/news/' | relative_url }}">&larr; Back to news</a></p>
  </div>
</section>
